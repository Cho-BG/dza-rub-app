# Keeps the free Supabase project awake (free projects pause after 7 days without activity)
# and keeps this workflow itself enabled (GitHub disables schedules after 60 days without commits).
name: keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the bot (reads the price from the database)
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          curl -fsS "$URL/functions/v1/bot/price" && echo
      - name: Monthly heartbeat commit (keeps the schedule enabled)
        run: |
          if [ "$(git log -1 --format=%ct)" -lt "$(date -d '40 days ago' +%s)" ]; then
            git config user.name "keep-alive"; git config user.email "actions@users.noreply.github.com"
            date -u > .heartbeat && git add .heartbeat && git commit -m "keep-alive" && git push
          fi
